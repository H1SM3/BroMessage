<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BroChat: Telegram B&W Edition</title>
    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-sidebar: #121212;
            --bg-chat: #000000;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #222222;
            --accent-color: #ffffff;
            --msg-in: #181818;
            --msg-out: #ffffff;
            --msg-out-text: #000000;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: var(--bg-main); color: var(--text-main); 
            height: 100vh; height: 100dvh; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }

        /* Уведомление */
        .toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--text-main); color: var(--bg-chat);
            padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 14px;
            z-index: 9999; transition: top 0.4s ease; box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }
        .toast.show { top: 20px; }

        /* Окно авторизации */
        .auth-screen { 
            width: 100%; max-width: 400px; padding: 40px 24px; 
            background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 12px; text-align: center;
        }
        .auth-screen h2 { margin-bottom: 24px; letter-spacing: 1px; font-weight: 800; }
        .auth-input { 
            width: 100%; background: var(--bg-main); border: 1px solid var(--border-color); 
            padding: 14px; border-radius: 8px; color: var(--text-main); margin-bottom: 12px; outline: none; font-size: 14px;
        }
        .auth-input:focus { border-color: var(--accent-color); }
        .auth-btn { 
            width: 100%; background: var(--text-main); color: var(--bg-chat); border: none; 
            padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px;
        }
        .toggle-auth { margin-top: 16px; color: var(--text-muted); font-size: 13px; cursor: pointer; text-decoration: underline; }

        /* Основной интерфейс Telegram Style */
        .app-container { display: none; width: 100vw; height: 100vh; height: 100dvh; background: var(--bg-chat); position: relative; }
        
        /* Боковая панель (Список чатов) */
        .sidebar { 
            width: 320px; height: 100%; background: var(--bg-sidebar); 
            border-right: 1px solid var(--border-color); display: flex; flex-direction: column; 
            z-index: 5;
        }
        
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; }
        .profile-row { display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #222; }
        .user-name { font-weight: bold; font-size: 15px; }
        .logout-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; }
        .logout-btn:hover { color: var(--text-main); }

        /* Поиск контактов по нику */
        .search-bar { position: relative; display: flex; gap: 6px; }
        .search-input { 
            flex: 1; background: var(--bg-main); border: 1px solid var(--border-color); 
            padding: 10px 12px; border-radius: 8px; color: var(--text-main); font-size: 13px; outline: none;
        }
        .search-input:focus { border-color: #555; }
        .action-btn { background: #222; border: 1px solid var(--border-color); color: white; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }

        /* Список контактов */
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { 
            display: flex; align-items: center; gap: 12px; padding: 14px 16px; 
            cursor: pointer; border-bottom: 1px solid #161616; transition: background 0.2s;
        }
        .chat-item:hover, .chat-item.active { background: #1c1c1c; }
        .chat-item-details { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .chat-item-top { display: flex; justify-content: space-between; align-items: center; }
        .chat-item-name { font-weight: 600; font-size: 14px; }
        .chat-item-status { font-size: 11px; color: var(--text-muted); }

        /* Главное окно чата */
        .main-chat { flex: 1; height: 100%; display: flex; flex-direction: column; background: var(--bg-chat); min-height: 0; z-index: 10; }
        
        .chat-header { 
            padding: 14px 20px; background: var(--bg-sidebar); 
            border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 14px; min-height: 60px;
        }
        .back-button {
            display: none; background: transparent; border: none; color: var(--text-main); 
            font-size: 20px; font-weight: bold; cursor: pointer; padding: 4px 8px; margin-left: -8px;
        }
        .chat-header-info { display: flex; flex-direction: column; justify-content: center; }
        .chat-header-title { font-weight: bold; font-size: 15px; }
        .chat-header-status { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        /* Область сообщений */
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg-row { display: flex; width: 100%; }
        .msg-row.out { justify-content: flex-end; }
        
        .msg-bubble { 
            max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; 
            line-height: 1.4; word-wrap: break-word; display: flex; flex-direction: column; 
        }
        .msg-row.in .msg-bubble { background: var(--msg-in); color: var(--text-main); border-radius: 16px 16px 16px 4px; }
        .msg-row.out .msg-bubble { background: var(--msg-out); color: var(--msg-out-text); border-radius: 16px 16px 4px 16px; font-weight: 500; }
        
        .msg-author { font-size: 11px; font-weight: bold; color: #888; margin-bottom: 3px; text-transform: uppercase; }
        .msg-meta { font-size: 10px; align-self: flex-end; margin-top: 4px; color: var(--text-muted); }
        .msg-row.out .msg-meta { color: #555; }

        /* Панель ввода как в WhatsApp — идеально приподнята на мобилках */
        .bottom-input-panel { 
            padding: 16px; 
            background: var(--bg-sidebar); 
            border-top: 1px solid var(--border-color); 
            display: flex; 
            gap: 12px; 
            align-items: center; 
        }
        .main-input { 
            flex: 1; background: var(--bg-main); border: 1px solid #333; 
            outline: none; padding: 14px 18px; border-radius: 24px; color: var(--text-main); font-size: 15px;
        }
        .main-input:focus { border-color: var(--accent-color); }
        .send-button { 
            background: var(--accent-color); color: var(--bg-chat); border: none; 
            padding: 12px 24px; border-radius: 24px; font-weight: bold; font-size: 14px; cursor: pointer;
        }

        /* МОБИЛЬНАЯ ВЕРСТКА: А-ля WhatsApp / Telegram Mobile */
        @media(max-width: 768px) {
            body { height: 100dvh; align-items: stretch; }
            .app-container { width: 100%; height: 100dvh; display: none; }
            
            /* Списку контактов и чату даем полную ширину и высоту */
            .sidebar { 
                position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                border-right: none; transition: transform 0.2s ease;
            }
            .main-chat { 
                position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                display: none; /* Скрыт, пока не выберем чат */
            }

            /* Кнопка "Назад" становится видимой в открытом чате */
            .back-button { display: block; }

            /* Классы состояний для переключения экранов */
            .app-container.chat-open .sidebar { display: none; }
            .app-container.chat-open .main-chat { display: flex; }

            /* Сдвигаем панель ввода повыше, чтобы не перекрывалась навигацией */
            .bottom-input-panel { 
                padding-bottom: calc(20px + env(safe-area-inset-bottom, 12px)); 
            }
        }
    </style>
</head>
<body>

    <div class="toast" id="appToast">БРО НА СВЯЗИ</div>

    <!-- ЭКРАН ВХОДА / РЕГИСТРАЦИИ -->
    <div class="auth-screen" id="authScreen">
        <h2 id="authHeadline">BROCHAT TG LOGIN</h2>
        <input type="text" class="auth-input" id="authNick" placeholder="ЮЗЕРНЕЙМ (БЕЗ @)" style="display: none;">
        <input type="email" class="auth-input" id="authMail" placeholder="EMAIL">
        <input type="password" class="auth-input" id="authPass" placeholder="ПАРОЛЬ">
        <button class="auth-btn" id="authSubmit">ВОЙТИ</button>
        <div class="toggle-auth" id="authToggle">НЕТ АККАУНТА? СОЗДАТЬ</div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div class="app-container" id="appScreen">
        <!-- СПИСОК ЧАТОВ -->
        <div class="sidebar" id="sidebarElement">
            <div class="sidebar-header">
                <div class="profile-row">
                    <div class="user-info">
                        <img class="user-avatar" id="myAvatar" src="" alt="">
                        <span class="user-name" id="myProfileName">ЗАГРУЗКА...</span>
                    </div>
                    <button class="logout-btn" id="appLogout">ВЫХОД</button>
                </div>
                
                <div class="search-bar">
                    <input type="text" class="search-input" id="searchContactInput" placeholder="ПОИСК ПО НИКУ (HSDUNT)...">
                    <button class="action-btn" id="searchContactBtn">НАЙТИ</button>
                    <button class="action-btn" id="makeGroupBtn">+ГР</button>
                </div>
            </div>

            <div class="chats-list" id="chatsContainer"></div>
        </div>

        <!-- ОКНО ЧАТА -->
        <div class="main-chat" id="mainChatElement">
            <div class="chat-header">
                <button class="back-button" id="backToChatsBtn">←</button>
                <div class="chat-header-info">
                    <div class="chat-header-title" id="activeChatTitle">ВЫБЕРИТЕ КОМУ НАПИСАТЬ</div>
                    <div class="chat-header-status" id="activeChatStatus"></div>
                </div>
            </div>

            <div class="messages-container" id="messagesView"></div>

            <div class="bottom-input-panel">
                <input type="text" class="main-input" id="messageField" placeholder="Сообщение" disabled>
                <button class="send-button" id="sendMsgBtn" disabled>ОК</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyD_eF_UR7iG" + "XbXlHDroAGYPDfAbd6zX27g", authDomain: "brochat-ce389.firebaseapp.com", projectId: "brochat-ce389", storageBucket: "brochat-ce389.appspot.com", messagingSenderId: "856173025113", appId: "1:856173025113:web:c3910728e5195a62db5e48" };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authScreen = document.getElementById('authScreen'), appScreen = document.getElementById('appScreen');
        const authHeadline = document.getElementById('authHeadline'), authSubmit = document.getElementById('authSubmit'), authToggle = document.getElementById('authToggle');
        const authNick = document.getElementById('authNick'), authMail = document.getElementById('authMail'), authPass = document.getElementById('authPass');
        const myAvatar = document.getElementById('myAvatar'), myProfileName = document.getElementById('myProfileName'), appLogout = document.getElementById('appLogout');
        const searchContactInput = document.getElementById('searchContactInput'), searchContactBtn = document.getElementById('searchContactBtn'), makeGroupBtn = document.getElementById('makeGroupBtn');
        const chatsContainer = document.getElementById('chatsContainer'), activeChatTitle = document.getElementById('activeChatTitle'), activeChatStatus = document.getElementById('activeChatStatus'), messagesView = document.getElementById('messagesView');
        const messageField = document.getElementById('messageField'), sendMsgBtn = document.getElementById('sendMsgBtn');
        const appToast = document.getElementById('appToast'), backToChatsBtn = document.getElementById('backToChatsBtn');

        let isRegisterMode = false, me = null, activeTarget = null, un有機msg = null, un有機status = null;
        const avatarPlaceholder = "https://api.dicebear.com/7.x/bottts/svg?seed=tele";

        authToggle.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            authHeadline.textContent = isRegisterMode ? "BROCHAT REGISTRATION" : "BROCHAT TG LOGIN";
            authSubmit.textContent = isRegisterMode ? "СОЗДАТЬ" : "ВОЙТИ";
            authToggle.textContent = isRegisterMode ? "ЕСТЬ АККАУНТ? ВОЙТИ" : "НЕТ АККАУНТА? СОЗДАТЬ";
            authNick.style.display = isRegisterMode ? 'block' : 'none';
        });

        function showToast(text) { appToast.textContent = text; appToast.classList.add('show'); setTimeout(() => appToast.classList.remove('show'), 3000); }

        async function updateStatus(val) {
            if (auth.currentUser) { try { await updateDoc(doc(db, "users", auth.currentUser.uid), { status: val }); } catch(e){} }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    me = docSnap.data();
                    myProfileName.textContent = "@" + me.username.toUpperCase();
                    myAvatar.src = me.avatarUrl || avatarPlaceholder;
                    authScreen.style.display = 'none';
                    appScreen.style.display = 'block';
                    showToast("ВХОД ВЫПОЛНЕН: " + me.username.toUpperCase());
                    await updateStatus("онлайн");
                    renderHubs();
                }
            } else {
                authScreen.style.display = 'block';
                appScreen.style.display = 'none';
                appScreen.classList.remove('chat-open');
                chatsContainer.innerHTML = '';
            }
        });

        authSubmit.addEventListener('click', async () => {
            const email = authMail.value.trim(), pass = authPass.value.trim(), username = authNick.value.trim().toLowerCase();
            if (!email || !pass || (isRegisterMode && !username)) { alert("Заполни поля!"); return; }
            
            try {
                if (isRegisterMode) {
                    const checkQ = query(collection(db, "users"), where("username", "==", username));
                    const snap = await getDocs(checkQ);
                    if (!snap.empty) { alert("Никнейм уже занят другим бро!"); return; }
                    
                    const cred = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", cred.user.uid), {
                        uid: cred.user.uid, username: username, email: email, avatarUrl: avatarPlaceholder, friends: [], groups: [], status: "онлайн"
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch(e) { alert("Ошибка: " + e.message); }
        });

        appLogout.addEventListener('click', async () => { await updateStatus("был в сети"); signOut(auth); });

        // Кнопка назад для мобилок
        backToChatsBtn.addEventListener('click', () => {
            appScreen.classList.remove('chat-open');
            activeTarget = null;
            if (un有機msg) un有機msg();
            if (un有機status) un有機status();
        });

        searchContactBtn.addEventListener('click', async () => {
            const searchTarget = searchContactInput.value.trim().toLowerCase();
            if (!searchTarget || searchTarget === me.username) return;

            const q = query(collection(db, "users"), where("username", "==", searchTarget));
            const snap = await getDocs(q);

            if (snap.empty) {
                alert("Пользователь @" + searchTarget.toUpperCase() + " не найден!");
                return;
            }

            const targetUser = snap.docs[0].data();
            
            if (!me.friends.includes(targetUser.uid)) {
                me.friends.push(targetUser.uid);
                await updateDoc(doc(db, "users", auth.currentUser.uid), { friends: me.friends });
                
                const remoteFriends = targetUser.friends || [];
                if (!remoteFriends.includes(auth.currentUser.uid)) {
                    remoteFriends.push(auth.currentUser.uid);
                    await updateDoc(doc(db, "users", targetUser.uid), { friends: remoteFriends });
                }
            }
            searchContactInput.value = '';
            renderHubs();
            showToast("КОНТАКТ ДОБАВЛЕН!");
        });

        makeGroupBtn.addEventListener('click', async () => {
            const rawGName = searchContactInput.value.trim();
            if (!rawGName) { alert("Введи название группы в поле поиска!"); return; }
            
            const gId = "group_" + Date.now();
            await setDoc(doc(db, "groups", gId), { id: gId, name: rawGName, creator: me.username });
            
            const myGroups = me.groups || [];
            myGroups.push(gId);
            await updateDoc(doc(db, "users", auth.currentUser.uid), { groups: myGroups });
            me.groups = myGroups;
            
            searchContactInput.value = '';
            renderHubs();
            showToast("ГРУППА СОЗДАНА!");
        });

        async function renderHubs() {
            chatsContainer.innerHTML = '';
            if (me.friends) {
                for (let fUid of me.friends) {
                    const fSnap = await getDoc(doc(db, "users", fUid));
                    if (fSnap.exists()) drawItem(fSnap.data(), 'dm');
                }
            }
            if (me.groups) {
                for (let gId of me.groups) {
                    const gSnap = await getDoc(doc(db, "groups", gId));
                    if (gSnap.exists()) drawItem(gSnap.data(), 'group');
                }
            }
        }

        function drawItem(data, type) {
            const item = document.createElement('div');
            item.classList.add('chat-item');
            
            const isDm = type === 'dm';
            const nameTxt = isDm ? `@${data.username.toUpperCase()}` : `👥 ${data.name.toUpperCase()}`;
            const subTxt = isDm ? data.status : 'групповой чат';

            item.innerHTML = `
                <img class="user-avatar" src="${data.avatarUrl || avatarPlaceholder}" alt="">
                <div class="chat-item-details">
                    <div class="chat-item-top">
                        <span class="chat-item-name">${nameTxt}</span>
                    </div>
                    <span class="chat-item-status">${subTxt}</span>
                </div>
            `;

            item.addEventListener('click', () => {
                document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                openChat(data, type);
            });
            chatsContainer.appendChild(item);
        }

        function openChat(data, type) {
            activeTarget = { data, type };
            const isDm = type === 'dm';
            
            activeChatTitle.textContent = isDm ? `@${data.username.toUpperCase()}` : `👥 ${data.name.toUpperCase()}`;
            messageField.disabled = false;
            sendMsgBtn.disabled = false;

            // Включаем мобильный полноэкранный режим чата
            appScreen.classList.add('chat-open');

            if (un有機status) un有機status();
            if (isDm) {
                un有機status = onSnapshot(doc(db, "users", data.uid), (s) => {
                    if (s.exists()) activeChatStatus.textContent = s.data().status.toUpperCase();
                });
            } else {
                activeChatStatus.textContent = `ВЛАДЕЛЕЦ: @${data.creator.toUpperCase()}`;
            }

            const dbPath = isDm ? `chats/${[auth.currentUser.uid, data.uid].sort().join('_')}/messages` : `groups/${data.id}/messages`;
            if (un有機msg) un有機msg();

            const qMsg = query(collection(db, dbPath), orderBy("timestamp", "asc"));
            un有機msg = onSnapshot(qMsg, (snap) => {
                messagesView.innerHTML = '';
                snap.forEach((mDoc) => {
                    const m = mDoc.data();
                    const isOutgoing = m.senderId === auth.currentUser.uid;
                    const row = document.createElement('div');
                    row.classList.add('msg-row', isOutgoing ? 'out' : 'in');

                    const time = m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';
                    
                    row.innerHTML = `
                        <div class="msg-bubble">
                            ${!isOutgoing ? `<span class="msg-author">${m.senderName}</span>` : ''}
                            <div>${m.text}</div>
                            <span class="msg-meta">${time}</span>
                        </div>
                    `;
                    messagesView.appendChild(row);
                });
                messagesView.scrollTop = messagesView.scrollHeight;
            });
        }

        async function sendMsg() {
            const txt = messageField.value.trim();
            if (!txt || !activeTarget) return;

            const isDm = activeTarget.type === 'dm';
            const baseFolder = isDm ? `chats/${[auth.currentUser.uid, activeTarget.data.uid].sort().join('_')}/messages` : `groups/${activeTarget.data.id}/messages`;

            messageField.value = '';

            await addDoc(collection(db, baseFolder), {
                text: txt,
                senderId: auth.currentUser.uid,
                senderName: me.username.toUpperCase(),
                timestamp: new Date()
            });

            if (txt.toLowerCase().startsWith('@gemini')) {
                const cleanQuestion = txt.replace(/@gemini/i, '').trim();
                
                const aiTempDoc = await addDoc(collection(db, baseFolder), {
                    text: "🤖 Думаю...",
                    senderId: "gemini_bot_uid",
                    senderName: "GEMINI BOT",
                    timestamp: new Date()
                });

                try {
                    const aiResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${firebaseConfig.apiKey.substring(0,13)}eF_UR7iGXbXlHDroAGYPDfAbd6zX27g`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: cleanQuestion + " (Ответь как мой бро, используй молодежный сленг, отвечай кратко)" }] }] })
                    });
                    
                    const resData = await aiResponse.json();
                    const aiText = resData.candidates[0].content.parts[0].text;

                    await updateDoc(doc(db, baseFolder, aiTempDoc.id), { text: aiText });
                } catch(err) {
                    await updateDoc(doc(db, baseFolder, aiTempDoc.id), { text: "⚠️ Ошибка сети API. Проверь баланс/ключи базы!" });
                }
            }
        }

        sendMsgBtn.addEventListener('click', sendMsg);
        messageField.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });
    </script>
</body>
</html>
