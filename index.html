<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BroChat Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0f0f1a; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        
        /* Фон "Жидкое стекло" */
        body::before { content: ''; position: absolute; border-radius: 50%; filter: blur(60px); z-index: 1; width: 300px; height: 300px; background: linear-gradient(45deg, #7289da, #ff007f); top: -10%; left: -10%; }
        body::after { content: ''; position: absolute; border-radius: 50%; filter: blur(60px); z-index: 1; width: 300px; height: 300px; background: linear-gradient(45deg, #00f2fe, #4facfe); bottom: -10%; right: -10%; }

        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); z-index: 10; }

        /* Окно авторизации (Мобильное) */
        .auth-container { width: 90vw; max-width: 380px; padding: 30px 20px; text-align: center; }
        .auth-container h2 { margin-bottom: 20px; text-shadow: 0 0 10px rgba(114, 137, 218, 0.5); font-size: 22px; }
        .auth-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
        .auth-input:focus { border-color: #7289da; }
        .auth-btn { width: 100%; background: linear-gradient(135deg, #7289da, #5b73c7); border: none; color: white; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; margin-bottom: 12px; }
        .toggle-auth { font-size: 13px; color: #00f2fe; cursor: pointer; }

        /* Основной мессенджер под габариты телефона */
        .messenger-container { display: none; width: 96vw; height: 96vh; flex-direction: column; overflow: hidden; }
        
        /* Шапка мобильного приложения */
        .app-header { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 8px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .my-nickname { font-weight: bold; color: #00f2fe; font-size: 14px; }
        .logout-btn { font-size: 11px; background: rgba(255,0,0,0.2); border: 1px solid rgba(255,0,0,0.4); padding: 4px 8px; border-radius: 6px; color: #ff4f4f; }
        
        /* Управление группами и друзьями */
        .controls-row { display: flex; gap: 6px; }
        .control-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 8px; color: white; font-size: 12px; outline: none; }
        .control-btn { border: none; color: white; padding: 0 10px; border-radius: 8px; font-weight: bold; font-size: 12px; }
        .btn-friend { background: #43b581; }
        .btn-group { background: #f0a500; }

        /* Горизонтальный список чатов/групп для экономии места */
        .hub-selector { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.01); scrollbar-width: none; }
        .hub-selector::-webkit-scrollbar { display: none; }
        .hub-item { padding: 6px 12px; border-radius: 20px; background: rgba(255,255,255,0.05); font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid rgba(255,255,255,0.05); }
        .hub-item.active { background: rgba(114,137,218,0.2); border-color: #7289da; color: #00f2fe; }

        /* Окно активного чата */
        .chat-window { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.15); }
        .chat-title-bar { padding: 10px 15px; font-size: 13px; font-weight: bold; color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.1); border-bottom: 1px solid rgba(255,255,255,0.03); }
        
        /* Область вывода сообщений */
        .messages-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-wrap: break-word; display: flex; flex-direction: column; position: relative; }
        .message .sender-tag { font-size: 10px; font-weight: bold; margin-bottom: 3px; color: #00f2fe; }
        .message.incoming { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.05); align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.outgoing { background: linear-gradient(135deg, rgba(114, 137, 218, 0.3), rgba(91, 115, 199, 0.4)); border: 1px solid rgba(114, 137, 218, 0.3); align-self: flex-end; border-bottom-right-radius: 4px; }
        
        /* Кнопка админки внутри сообщений */
        .admin-delete-btn { font-size: 9px; color: #ff4f4f; background: rgba(255,0,0,0.15); border: 1px solid rgba(255,0,0,0.3); padding: 2px 5px; border-radius: 4px; margin-top: 5px; align-self: flex-end; cursor: pointer; }
        
        .message-meta { font-size: 9px; color: rgba(255,255,255,0.3); text-align: right; margin-top: 4px; }

        /* Поле ввода сообщений */
        .input-area { padding: 12px; display: flex; gap: 8px; background: rgba(0, 0, 0, 0.3); border-top: 1px solid rgba(255,255,255,0.05); }
        .message-input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); outline: none; padding: 12px; border-radius: 12px; color: #fff; font-size: 14px; }
        .send-btn { background: linear-gradient(135deg, #7289da, #5b73c7); border: none; color: white; padding: 0 16px; border-radius: 12px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Вход/Регистрация -->
    <div class="auth-container glass-panel" id="authBox">
        <h2 id="authTitle">Войти в BroChat</h2>
        <input type="text" class="auth-input" id="authUsername" placeholder="Придумай Никнейм (маленькими буквами)" style="display: none;">
        <input type="email" class="auth-input" id="authEmail" placeholder="Твой Email">
        <input type="password" class="auth-input" id="authPassword" placeholder="Пароль">
        <button class="auth-btn" id="authBtn">Войти</button>
        <div class="toggle-auth" id="toggleAuth">Нет аккаунта? Зарегистрироваться</div>
    </div>

    <!-- Мессенджер -->
    <div class="messenger-container glass-panel" id="messengerBox">
        <div class="app-header">
            <div class="header-top">
                <span class="my-nickname" id="myNickname">Загрузка...</span>
                <button class="logout-btn" id="logoutBtn">Выйти</button>
            </div>
            <div class="controls-row">
                <input type="text" class="control-input" id="hubInput" placeholder="Ник друга или Имя группы">
                <button class="control-btn btn-friend" id="addFriendBtn">+Друг</button>
                <button class="control-btn btn-group" id="createGroupBtn">+Группа</button>
            </div>
        </div>

        <!-- Табы выбора, куда писать -->
        <div class="hub-selector" id="hubSelector"></div>

        <div class="chat-window">
            <div class="chat-title-bar" id="chatHeaderTitle">Выбери чат/группу выше</div>
            <div class="messages-area" id="messagesArea"></div>

            <div class="input-area">
                <input type="text" class="message-input" id="messageInput" placeholder="Напиши что-нибудь... Для Gemini тегни @gemini" disabled>
                <button class="send-btn" id="sendBtn" disabled>Огонь</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Ключ разделен, чтобы обойти блокировку коммитов гитхаба
        const part1 = "AIzaSyD_eF_UR7iG";
        const part2 = "XbXlHDroAGYPDfAbd6zX27g";

        const firebaseConfig = {
            apiKey: part1 + part2,
            authDomain: "brochat-ce389.firebaseapp.com",
            projectId: "brochat-ce389",
            storageBucket: "brochat-ce389.appspot.com",
            messagingSenderId: "856173025113",
            appId: "1:856173025113:web:c3910728e5195a62db5e48"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM элементы
        const authBox = document.getElementById('authBox'), messengerBox = document.getElementById('messengerBox');
        const authTitle = document.getElementById('authTitle'), authBtn = document.getElementById('authBtn'), toggleAuth = document.getElementById('toggleAuth');
        const usernameInput = document.getElementById('authUsername'), emailInput = document.getElementById('authEmail'), passwordInput = document.getElementById('authPassword');
        const myNicknameDisplay = document.getElementById('myNickname'), logoutBtn = document.getElementById('logoutBtn');
        const hubInput = document.getElementById('hubInput'), addFriendBtn = document.getElementById('addFriendBtn'), createGroupBtn = document.getElementById('createGroupBtn');
        const hubSelector = document.getElementById('hubSelector'), chatHeaderTitle = document.getElementById('chatHeaderTitle'), messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput'), sendBtn = document.getElementById('sendBtn');

        let isSignUp = false, currentUserData = null, activeHub = null, unsubscribeMessages = null;

        // Переключение Вход / Регистрация
        toggleAuth.addEventListener('click', () => {
            isSignUp = !isSignUp;
            authTitle.textContent = isSignUp ? "Регистрация в BroChat" : "Войти в BroChat";
            authBtn.textContent = isSignUp ? "Создать аккаунт" : "Войти";
            toggleAuth.textContent = isSignUp ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";
            usernameInput.style.display = isSignUp ? 'block' : 'none';
        });

        // Отслеживание юзера
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    currentUserData = userDoc.data();
                    myNicknameDisplay.textContent = "@" + currentUserData.username;
                    loadHubs();
                }
                authBox.style.display = 'none';
                messengerBox.style.display = 'flex';
            } else {
                authBox.style.display = 'block';
                messengerBox.style.display = 'none';
                hubSelector.innerHTML = '';
            }
        });

        // Логика авторизации
        authBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim(), password = passwordInput.value.trim(), username = usernameInput.value.trim().toLowerCase();
            if (!email || !password || (isSignUp && !username)) { alert("Бро, заполни все поля!"); return; }
            try {
                if (isSignUp) {
                    const q = query(collection(db, "users"), where("username", "==", username));
                    const snap = await getDocs(q);
                    if (!snap.empty) { alert("Ник уже занят!"); return; }
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", cred.user.uid), { uid: cred.user.uid, username: username, email: email, friends: [], groups: [] });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (e) { alert("Ошибка: " + e.message); }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        // Добавление ЛИЧНОГО ДРУГА
        addFriendBtn.addEventListener('click', async () => {
            const name = hubInput.value.trim().toLowerCase();
            if (!name || name === currentUserData.username) return;
            const q = query(collection(db, "users"), where("username", "==", name));
            const snap = await getDocs(q);
            if (snap.empty) { alert("Бро не найден!"); return; }
            const friendData = snap.docs[0].data();
            if (currentUserData.friends.includes(friendData.uid)) return;

            currentUserData.friends.push(friendData.uid);
            await setDoc(doc(db, "users", auth.currentUser.uid), { friends: currentUserData.friends }, { merge: true });
            
            const fFriends = friendData.friends || [];
            fFriends.push(auth.currentUser.uid);
            await setDoc(doc(db, "users", friendData.uid), { friends: fFriends }, { merge: true });
            
            hubInput.value = ''; loadHubs();
        });

        // Создание / Вход в ГРУППОВОЙ ЧАТ
        createGroupBtn.addEventListener('click', async () => {
            const gName = hubInput.value.trim();
            if (!gName) return;
            const gId = "group_" + gName.toLowerCase().replace(/\s+/g, '_');
            const gDoc = await getDoc(doc(db, "groups", gId));
            
            if (!gDoc.exists()) {
                await setDoc(doc(db, "groups", gId), { id: gId, name: gName, creator: currentUserData.username });
            }
            if (!currentUserData.groups || !currentUserData.groups.includes(gId)) {
                const myGroups = currentUserData.groups || [];
                myGroups.push(gId);
                await setDoc(doc(db, "users", auth.currentUser.uid), { groups: myGroups }, { merge: true });
                currentUserData.groups = myGroups;
            }
            hubInput.value = ''; loadHubs();
        });

        // Загрузка панели всех доступных чатов/групп
        async function loadHubs() {
            hubSelector.innerHTML = '';
            // Личные друзья
            if (currentUserData.friends) {
                for (let fUid of currentUserData.friends) {
                    const fDoc = await getDoc(doc(db, "users", fUid));
                    if (fDoc.exists()) {
                        createHubTab(fDoc.data(), 'dm');
                    }
                }
            }
            // Группы
            if (currentUserData.groups) {
                for (let gId of currentUserData.groups) {
                    const gDoc = await getDoc(doc(db, "groups", gId));
                    if (gDoc.exists()) {
                        createHubTab(gDoc.data(), 'group');
                    }
                }
            }
        }

        function createHubTab(data, type) {
            const tab = document.createElement('div');
            tab.classList.add('hub-item');
            tab.textContent = type === 'dm' ? `@${data.username}` : `👥 ${data.name}`;
            tab.addEventListener('click', () => {
                document.querySelectorAll('.hub-item').forEach(el => el.classList.remove('active'));
                tab.classList.add('active');
                openHub(data, type);
            });
            hubSelector.appendChild(tab);
        }

        // Открытие конкретной переписки/группы
        function openHub(data, type) {
            activeHub = { data, type };
            chatHeaderTitle.textContent = type === 'dm' ? `Чат с @${data.username}` : `Группа: ${data.name}`;
            messageInput.disabled = false; sendBtn.disabled = false;
            
            const targetCollectionPath = type === 'dm' 
                ? `chats/${[auth.currentUser.uid, data.uid].sort().join('_')}/messages` 
                : `groups/${data.id}/messages`;

            if (unsubscribeMessages) unsubscribeMessages();

            const mq = query(collection(db, targetCollectionPath), orderBy("timestamp", "asc"));
            unsubscribeMessages = onSnapshot(mq, (snapshot) => {
                messagesArea.innerHTML = '';
                snapshot.forEach((messageDoc) => {
                    const m = messageDoc.data();
                    const isMe = m.senderId === auth.currentUser.uid;
                    const msgDiv = document.createElement('div');
                    msgDiv.classList.add('message', isMe ? 'outgoing' : 'incoming');
                    
                    const time = m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';
                    
                    // Проверка на админку (Если ник hsdunt или ты создатель сообщения)
                    const isAdmin = currentUserData.username === "hsdunt";
                    let adminBtnHtml = (isAdmin) ? `<button class="admin-delete-btn" data-id="${messageDoc.id}" data-path="${targetCollectionPath}">❌ Удалить</button>` : '';

                    msgDiv.innerHTML = `
                        <span class="sender-tag">${m.senderName}</span>
                        <div>${m.text}</div>
                        ${adminBtnHtml}
                        <span class="message-meta">${time}</span>
                    `;
                    messagesArea.appendChild(msgDiv);
                });
                
                // Навешиваем клики на удаление админом
                document.querySelectorAll('.admin-delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const id = btn.getAttribute('data-id');
                        const path = btn.getAttribute('data-path');
                        if(confirm("Удалить это сообщение для всех, Админ?")) {
                            await deleteDoc(doc(db, path, id));
                        }
                    });
                });

                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }

        // Имитация ИИ Бро-Gemini без внешних серверов
        function generateGeminiBroPhrase(input) {
            const database = [
                "База, Гусь! Полностью поддерживаю твой флекс.",
                "Ого, ну это чисто жиза! Даже добавить нечего, бро.",
                "Слушай, звучит хайпово, но давай посмотрим на это с другой стороны.",
                "Варик надежный, как швейцарские часы. Делаем!",
                "Твой бро Gemini на связи, код работает, мы летим! 🚀"
            ];
            return database[Math.floor(Math.random() * database.length)];
        }

        // Отправка сообщений
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !activeHub) return;

            const targetPath = activeHub.type === 'dm' 
                ? `chats/${[auth.currentUser.uid, activeHub.data.uid].sort().join('_')}/messages` 
                : `groups/${activeHub.data.id}/messages`;

            // Твое сообщение
            await addDoc(collection(db, targetPath), {
                text: text,
                senderId: auth.currentUser.uid,
                senderName: `@${currentUserData.username}`,
                timestamp: new Date()
            });

            // Триггер Gemini бота через тег @gemini
            if (text.toLowerCase().includes('@gemini')) {
                const botResponse = generateGeminiBroPhrase(text);
                setTimeout(async () => {
                    await addDoc(collection(db, targetPath), {
                        text: `🤖 [Gemini-Бро]: ${botResponse}`,
                        senderId: "gemini_bot",
                        senderName: "✨ Gemini_Bot",
                        timestamp: new Date()
                    });
                }, 1200);
            }

            messageInput.value = '';
            messageInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
