<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BroChat B&W Edition</title>
    <style>
        :root {
            --bg-body: #000000;
            --panel-bg: #0a0a0a;
            --text-color: #ffffff;
            --border-color: #222222;
            --input-bg: #121212;
            --input-border: #333333;
            --msg-in-bg: #161616;
            --msg-out-bg: #ffffff;
            --msg-out-text: #000000;
            --meta-color: #666666;
            --accent-color: #ffffff;
        }

        [data-theme="light"] {
            --bg-body: #ffffff;
            --panel-bg: #f9f9f9;
            --text-color: #000000;
            --border-color: #dddddd;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --msg-in-bg: #eeeeee;
            --msg-out-bg: #000000;
            --msg-out-text: #ffffff;
            --meta-color: #888888;
            --accent-color: #000000;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background: var(--bg-body); color: var(--text-color); 
            height: 100vh; height: -webkit-fill-available; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden;
        }

        .glass-panel { 
            background: var(--panel-bg); 
            border: 1px solid var(--border-color); border-radius: 16px; 
            width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden;
        }

        .toast-welcome {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--text-color); color: var(--bg-body);
            padding: 12px 24px; border-radius: 4px; font-weight: 700; font-size: 14px;
            border: 1px solid var(--border-color); z-index: 9999;
            transition: top 0.4s ease;
        }
        .toast-welcome.show { top: 20px; }

        /* Окно звонка */
        .call-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000; z-index: 9999;
            display: none; flex-direction: column; justify-content: center;
            align-items: center; gap: 20px; text-align: center;
        }
        .call-avatar { width: 100px; height: 100px; border-radius: 50%; border: 2px solid #fff; filter: grayscale(100%); }
        .call-video-preview { width: 90%; max-width: 400px; height: 250px; background: #111; border-radius: 8px; object-fit: cover; display: none; border: 1px solid #fff; }
        .btn-end-call { background: #ffffff; border: none; color: #000000; width: 50px; height: 50px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-weight: bold; }

        /* Вход */
        .auth-container { width: 90vw; max-width: 360px; height: auto; padding: 30px 20px; text-align: center; border-radius: 12px; }
        .auth-container h2 { margin-bottom: 20px; font-weight: 700; font-size: 22px; letter-spacing: -0.5px; }
        .auth-input { width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); padding: 12px; border-radius: 6px; color: var(--text-color); font-size: 14px; margin-bottom: 12px; outline: none; }
        .auth-input:focus { border-color: var(--text-color); }
        .auth-btn { width: 100%; background: var(--text-color); border: none; color: var(--bg-body); padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 14px; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .toggle-auth { font-size: 12px; color: var(--meta-color); cursor: pointer; text-decoration: underline; }

        /* Контейнер чата */
        .messenger-container { display: none; width: 100vw; height: 100vh; }
        
        /* Шапка */
        .app-header { padding: 14px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .user-block { display: flex; align-items: center; gap: 8px; }
        .my-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); filter: grayscale(100%); }
        .my-nickname { font-weight: 700; font-size: 14px; }
        .header-nav-btns { display: flex; gap: 6px; }
        .nav-btn { font-size: 12px; border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 4px; font-weight: 600; color: var(--text-color); background: transparent; cursor: pointer; }
        .nav-btn:active { background: var(--text-color); color: var(--bg-body); }
        
        /* Кнопки управления */
        .controls-row { display: flex; gap: 6px; }
        .control-input { flex: 1; background: var(--input-bg); border: 1px solid var(--input-border); padding: 8px 12px; border-radius: 6px; color: var(--text-color); font-size: 13px; outline: none; }
        .control-input:focus { border-color: var(--text-color); }
        .control-btn { border: 1px solid var(--border-color); background: transparent; color: var(--text-color); padding: 0 12px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }
        .control-btn:active { background: var(--text-color); color: var(--bg-body); }

        /* Настройки профиля */
        .profile-settings-panel { display: none; padding: 12px 0; border-top: 1px solid var(--border-color); margin-top: 5px; gap: 8px; flex-direction: column; }
        .theme-switch-btn, .profile-save-btn { width: 100%; padding: 8px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; }
        .profile-save-btn { background: var(--text-color); color: var(--bg-body); border: none; }

        /* Список чатов */
        .hub-selector { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; border-bottom: 1px solid var(--border-color); }
        .hub-item { padding: 6px 12px; border-radius: 4px; background: var(--input-bg); font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid var(--input-border); color: var(--text-color); cursor: pointer; }
        .hub-item.active { background: var(--text-color); color: var(--bg-body); border-color: var(--text-color); }

        /* Окно сообщений */
        .chat-window { flex: 1; display: flex; flex-direction: column; }
        .chat-title-bar { padding: 12px 14px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        #chatHeaderTitle { font-size: 13px; font-weight: 700; text-transform: uppercase; }
        #chatHeaderStatus { font-size: 11px; color: var(--meta-color); margin-left: 6px; }
        .call-action-btns { display: none; gap: 6px; }
        .call-act-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); font-size: 14px; width: 32px; height: 32px; border-radius: 4px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        
        .messages-area { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-row { display: flex; gap: 8px; width: 100%; }
        .message-row.outgoing { justify-content: flex-end; }
        
        .message { max-width: 80%; padding: 8px 12px; border-radius: 4px; font-size: 13px; line-height: 1.4; word-wrap: break-word; display: flex; flex-direction: column; }
        .message .sender-tag { font-size: 10px; font-weight: 700; margin-bottom: 2px; color: var(--meta-color); }
        .message-row.incoming .message { background: var(--msg-in-bg); border: 1px solid var(--border-color); }
        .message-row.outgoing .message { background: var(--msg-out-bg); color: var(--msg-out-text); }
        
        .block-user-btn { font-size: 9px; color: red; background: transparent; border: none; text-align: left; margin-top: 4px; cursor: pointer; text-decoration: underline; }
        .meta-container { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; }
        .message-meta { font-size: 9px; color: var(--meta-color); }

        /* Поле ввода */
        .input-area { padding: 14px; display: flex; gap: 8px; border-top: 1px solid var(--border-color); align-items: center; }
        .message-input { flex: 1; background: var(--input-bg); border: 1px solid var(--input-border); outline: none; padding: 12px; border-radius: 6px; color: var(--text-color); font-size: 14px; }
        .message-input:focus { border-color: var(--text-color); }
        
        .send-btn, .voice-start-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 12px 16px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .send-btn:active, .voice-start-btn:active { background: var(--text-color); color: var(--bg-body); }
        
        .voice-record-panel { display: none; flex: 1; align-items: center; justify-content: space-between; background: var(--input-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; font-size: 13px; }
        .voice-btn-cancel { color: var(--meta-color); background: none; border: none; cursor: pointer; }
        .voice-btn-success { color: var(--text-color); background: none; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="toast-welcome" id="welcomeToast">БРО НА СВЯЗИ: <span id="toastUser"></span></div>

    <div class="call-screen" id="callScreen">
        <img class="call-avatar" id="callAvatar" src="" alt="">
        <h2 id="callStatusTitle">ВЫЗОВ...</h2>
        <video class="call-video-preview" id="callVideoPreview" autoplay playsinline muted></video>
        <button class="btn-end-call" id="endCallBtn">✖</button>
    </div>

    <!-- Авторизация -->
    <div class="auth-container glass-panel" id="authBox">
        <h2 id="authTitle">BROCHAT LOGIN</h2>
        <input type="text" class="auth-input" id="authUsername" placeholder="НИКНЕЙМ" style="display: none;">
        <input type="email" class="auth-input" id="authEmail" placeholder="EMAIL">
        <input type="password" class="auth-input" id="authPassword" placeholder="ПАРОЛЬ">
        <button class="auth-btn" id="authBtn">ВОЙТИ</button>
        <div class="toggle-auth" id="toggleAuth">СОЗДАТЬ АККАУНТ</div>
    </div>

    <!-- Мессенджер -->
    <div class="messenger-container glass-panel" id="messengerBox">
        <div class="app-header">
            <div class="header-top">
                <div class="user-block" id="userBlock">
                    <img class="my-avatar" id="myAvatarDisplay" src="" alt="">
                    <span class="my-nickname" id="myNickname">ЗАГРУЗКА...</span>
                </div>
                <div class="header-nav-btns">
                    <button class="nav-btn" id="profileToggleBtn">⚙️ НАСТРОЙКИ</button>
                    <button class="nav-btn" id="logoutBtn">ВЫХОД</button>
                </div>
            </div>
            
            <div class="profile-settings-panel" id="profilePanel">
                <button class="theme-switch-btn" id="themeSwitchBtn">СМЕНИТЬ РЕЖИМ (B/W)</button>
                <input type="text" class="control-input" id="customNameInput" placeholder="ИЗМЕНИТЬ ИМЯ">
                <input type="text" class="control-input" id="customAvatarInput" placeholder="ССЫЛКА НА АВАТАР">
                <button class="profile-save-btn" id="saveProfileBtn">СОХРАНИТЬ</button>
                <div id="blockedUsersList" style="display:none;"></div>
            </div>

            <div class="controls-row">
                <input type="text" class="control-input" id="hubInput" placeholder="НИК ДРУГА ИЛИ ГРУППА">
                <button class="control-btn" id="addFriendBtn">+ДРУГ</button>
                <button class="control-btn" id="createGroupBtn">+ГРУППА</button>
            </div>
        </div>

        <div class="hub-selector" id="hubSelector"></div>

        <div class="chat-window">
            <div class="chat-title-bar">
                <div>
                    <span id="chatHeaderTitle">ВЫБЕРИТЕ ЧАТ</span>
                    <span id="chatHeaderStatus"></span>
                </div>
                <div class="call-action-btns" id="callBtnsBlock">
                    <button class="call-act-btn" id="audioCallBtn">📞</button>
                    <button class="call-act-btn" id="videoCallBtn">📹</button>
                </div>
            </div>
            <div class="messages-area" id="messagesArea"></div>

            <div class="input-area">
                <input type="text" class="message-input" id="messageInput" placeholder="СООБЩЕНИЕ..." disabled>
                
                <div class="voice-record-panel" id="voiceRecordPanel">
                    <span>ЗАПИСЬ: <span id="voiceTimer">00:00</span></span>
                    <div>
                        <button class="voice-btn-cancel" id="voiceCancelBtn">ОТМЕНА</button>
                        <button class="voice-btn-success" id="voiceSuccessBtn">ОТПРАВИТЬ</button>
                    </div>
                </div>

                <button class="voice-start-btn" id="voiceStartBtn" disabled>🎤</button>
                <button class="send-btn" id="sendBtn" disabled>ОК</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const part1 = "AIzaSyD_eF_UR7iG"; const part2 = "XbXlHDroAGYPDfAbd6zX27g";
        const firebaseConfig = { apiKey: part1 + part2, authDomain: "brochat-ce389.firebaseapp.com", projectId: "brochat-ce389", storageBucket: "brochat-ce389.appspot.com", messagingSenderId: "856173025113", appId: "1:856173025113:web:c3910728e5195a62db5e48" };

        const app = initializeApp(firebaseConfig); 
        const auth = getAuth(app); 
        const db = getFirestore(app);

        // UI Элементы
        const authBox = document.getElementById('authBox'), messengerBox = document.getElementById('messengerBox');
        const authTitle = document.getElementById('authTitle'), authBtn = document.getElementById('authBtn'), toggleAuth = document.getElementById('toggleAuth');
        const usernameInput = document.getElementById('authUsername'), emailInput = document.getElementById('authEmail'), passwordInput = document.getElementById('authPassword');
        const myNicknameDisplay = document.getElementById('myNickname'), myAvatarDisplay = document.getElementById('myAvatarDisplay'), logoutBtn = document.getElementById('logoutBtn');
        const profileToggleBtn = document.getElementById('profileToggleBtn'), profilePanel = document.getElementById('profilePanel'), customNameInput = document.getElementById('customNameInput'), customAvatarInput = document.getElementById('customAvatarInput'), saveProfileBtn = document.getElementById('saveProfileBtn'), themeSwitchBtn = document.getElementById('themeSwitchBtn');
        const hubInput = document.getElementById('hubInput'), addFriendBtn = document.getElementById('addFriendBtn'), createGroupBtn = document.getElementById('createGroupBtn');
        const hubSelector = document.getElementById('hubSelector'), chatHeaderTitle = document.getElementById('chatHeaderTitle'), chatHeaderStatus = document.getElementById('chatHeaderStatus'), messagesArea = document.getElementById('messagesArea'), callBtnsBlock = document.getElementById('callBtnsBlock');
        const messageInput = document.getElementById('messageInput'), sendBtn = document.getElementById('sendBtn');
        const welcomeToast = document.getElementById('welcomeToast'), toastUser = document.getElementById('toastUser');
        
        const audioCallBtn = document.getElementById('audioCallBtn'), videoCallBtn = document.getElementById('videoCallBtn'), callScreen = document.getElementById('callScreen'), callAvatar = document.getElementById('callAvatar'), callStatusTitle = document.getElementById('callStatusTitle'), callVideoPreview = document.getElementById('callVideoPreview'), endCallBtn = document.getElementById('endCallBtn');
        const voiceStartBtn = document.getElementById('voiceStartBtn'), voiceRecordPanel = document.getElementById('voiceRecordPanel'), voiceTimer = document.getElementById('voiceTimer'), voiceCancelBtn = document.getElementById('voiceCancelBtn'), voiceSuccessBtn = document.getElementById('voiceSuccessBtn');

        let isSignUp = false, currentUserData = null, activeHub = null, unsubscribeMessages = null, unsubscribeStatus = null, currentTheme = 'dark';
        let voiceInterval = null, voiceSeconds = 0, localStream = null, currentFriendStatus = "не в сети";
        const defaultAvatar = "https://api.dicebear.com/7.x/bottts/svg?seed=bro";

        // РАБОТА КНОПКИ НАСТРОЕК (ПРОФИЛЯ)
        profileToggleBtn.addEventListener('click', () => {
            if (profilePanel.style.display === 'flex') {
                profilePanel.style.display = 'none';
            } else {
                profilePanel.style.display = 'flex';
            }
        });

        // Смена темы
        themeSwitchBtn.addEventListener('click', () => { 
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark'; 
            document.documentElement.setAttribute('data-theme', currentTheme); 
        });

        // Сохранение настроек профиля
        saveProfileBtn.addEventListener('click', async () => {
            if (!auth.currentUser) return;
            const newName = customNameInput.value.trim();
            const newUrl = customAvatarInput.value.trim();
            await updateDoc(doc(db, "users", auth.currentUser.uid), {
                displayName: newName || currentUserData.username,
                avatarUrl: newUrl || defaultAvatar
            });
            alert("Профиль обновлен!");
            profilePanel.style.display = 'none';
        });

        toggleAuth.addEventListener('click', () => { isSignUp = !isSignUp; authTitle.textContent = isSignUp ? "BROCHAT REGISTRATION" : "BROCHAT LOGIN"; authBtn.textContent = isSignUp ? "СОЗДАТЬ" : "ВОЙТИ"; toggleAuth.textContent = isSignUp ? "ЕСТЬ АККАУНТ? ВОЙТИ" : "СОЗДАТЬ АККАУНТ"; usernameInput.style.display = isSignUp ? 'block' : 'none'; });
        function triggerWelcomeToast(name) { toastUser.textContent = name; welcomeToast.classList.add('show'); setTimeout(() => welcomeToast.classList.remove('show'), 3000); }

        // ЗАПРОС СИСТЕМНЫХ УВЕДОМЛЕНИЙ ПРИ СТАРТЕ
        if ("Notification" in window) {
            Notification.requestPermission();
        }

        async function setupPushNotifications(userUid) {
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                    console.log('Service Worker на базе!', registration);

                    // СЛУШАЕМ БАЗУ НА ПРЕДМЕТ НОВЫХ ЗВОНКОВ (ДЛЯ PUSH НА ТАРИФЕ SPARK)
                    // Вместо FCM Cloud API, клиент сам слушает коллекцию "calls" и вызывает пуш
                    onSnapshot(query(collection(db, "calls"), where("toUid", "==", userUid)), (snapshot) => {
                        snapshot.docChanges().forEach((change) => {
                            if (change.type === "added") {
                                const callData = change.doc.data();
                                if (Notification.permission === "granted") {
                                    new Notification("🤙 Входящий вызов в BroChat!", {
                                        body: `Тебе звонит @${callData.fromName}! Открой вкладку!`,
                                        requireInteraction: true
                                    });
                                }
                            }
                        });
                    });
                } catch (error) {
                    console.log('Ошибка пушей:', error);
                }
            }
        }

        async function setUserOnlineStatus(statusValue) {
            if (auth.currentUser) {
                await updateDoc(doc(db, "users", auth.currentUser.uid), { status: statusValue });
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    currentUserData = userDoc.data();
                    const finalName = currentUserData.displayName || "@" + currentUserData.username;
                    myNicknameDisplay.textContent = finalName.toUpperCase(); 
                    myAvatarDisplay.src = currentUserData.avatarUrl || defaultAvatar;
                    customNameInput.value = currentUserData.displayName || ""; 
                    customAvatarInput.value = currentUserData.avatarUrl || "";
                    if (messengerBox.style.display !== 'flex') triggerWelcomeToast(finalName.toUpperCase());
                    
                    await setUserOnlineStatus("онлайн");
                    setupPushNotifications(user.uid);
                    loadHubs();
                }
                authBox.style.display = 'none'; messengerBox.style.display = 'flex';
            } else { 
                authBox.style.display = 'block'; messengerBox.style.display = 'none'; hubSelector.innerHTML = ''; 
            }
        });

        authBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim(), password = passwordInput.value.trim(), username = usernameInput.value.trim().toLowerCase();
            if (!email || !password || (isSignUp && !username)) { alert("Заполни поля!"); return; }
            try {
                if (isSignUp) {
                    const q = query(collection(db, "users"), where("username", "==", username));
                    const snap = await getDocs(q); if (!snap.empty) { alert("Ник занят!"); return; }
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", cred.user.uid), { uid: cred.user.uid, username: username, displayName: username, email: email, avatarUrl: defaultAvatar, friends: [], groups: [], status: "онлайн" });
                } else { await signInWithEmailAndPassword(auth, email, password); }
            } catch (e) { alert("Ошибка: " + e.message); }
        });
        
        logoutBtn.addEventListener('click', async () => {
            await setUserOnlineStatus("был в сети");
            signOut(auth);
        });

        // Запись системного вызова в БД для пробития пуш-уведомления
        async function triggerCallPush(friendUid) {
            await addDoc(collection(db, "calls"), {
                toUid: friendUid,
                fromName: currentUserData.username,
                timestamp: new Date()
            });
        }

        // Звонки
        async function startCall(type) {
            callAvatar.src = activeHub.data.avatarUrl || defaultAvatar;
            callStatusTitle.textContent = type === 'video' ? `ВИДЕОВЫЗОВ: @${activeHub.data.username.toUpperCase()}` : `АУДИОВЫЗОВ: @${activeHub.data.username.toUpperCase()}`;
            callScreen.style.display = 'flex';
            
            // Если друг не в сети — отправляем сигнал через Firestore для пуша
            if (currentFriendStatus !== "онлайн") {
                triggerCallPush(activeHub.data.uid);
            }

            if (type === 'video') {
                callVideoPreview.style.display = 'block';
                try { localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); callVideoPreview.srcObject = localStream; } catch (e) { console.log("Камера недоступна", e); }
            } else { callVideoPreview.style.display = 'none'; }
        }
        audioCallBtn.addEventListener('click', () => startCall('audio'));
        videoCallBtn.addEventListener('click', () => startCall('video'));
        endCallBtn.addEventListener('click', () => { callScreen.style.display = 'none'; if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; } });

        // Голосовые сообщения
        voiceStartBtn.addEventListener('click', () => {
            messageInput.style.display = 'none'; voiceStartBtn.style.display = 'none'; sendBtn.style.display = 'none';
            voiceRecordPanel.style.display = 'flex'; voiceSeconds = 0; voiceTimer.textContent = "00:00";
            voiceInterval = setInterval(() => {
                voiceSeconds++;
                let mins = Math.floor(voiceSeconds / 60).toString().padStart(2, '0');
                let secs = (voiceSeconds % 60).toString().padStart(2, '0');
                voiceTimer.textContent = `${mins}:${secs}`;
            }, 1000);
        });
        function resetVoicePanel() { clearInterval(voiceInterval); voiceRecordPanel.style.display = 'none'; messageInput.style.display = 'block'; voiceStartBtn.style.display = 'flex'; sendBtn.style.display = 'flex'; }
        voiceCancelBtn.addEventListener('click', () => { resetVoicePanel(); });
        voiceSuccessBtn.addEventListener('click', async () => {
            const duration = voiceTimer.textContent; resetVoicePanel();
            const targetPath = activeHub.type === 'dm' ? `chats/${[auth.currentUser.uid, activeHub.data.uid].sort().join('_')}/messages` : `groups/${activeHub.data.id}/messages`;
            await addDoc(collection(db, targetPath), {
                text: `🎙️ ГОЛОСОВОЕ СООБЩЕНИЕ (${duration})`,
                isVoice: true,
                senderId: auth.currentUser.uid,
                senderName: currentUserData.displayName || "@" + currentUserData.username,
                timestamp: new Date()
            });
        });

        // Друзья и группы
        addFriendBtn.addEventListener('click', async () => {
            const name = hubInput.value.trim().toLowerCase(); if (!name || name === currentUserData.username) return;
            const q = query(collection(db, "users"), where("username", "==", name)); const snap = await getDocs(q);
            if (snap.empty) { alert("Пользователь не найден!"); return; }
            const friendData = snap.docs[0].data(); if (currentUserData.friends.includes(friendData.uid)) return;
            currentUserData.friends.push(friendData.uid); await updateDoc(doc(db, "users", auth.currentUser.uid), { friends: currentUserData.friends });
            const fFriends = friendData.friends || []; fFriends.push(auth.currentUser.uid); await updateDoc(doc(db, "users", friendData.uid), { friends: fFriends });
            hubInput.value = ''; loadHubs();
        });

        createGroupBtn.addEventListener('click', async () => {
            const gName = hubInput.value.trim(); if (!gName) return;
            const gId = "group_" + gName.toLowerCase().replace(/\s+/g, '_'); const gDoc = await getDoc(doc(db, "groups", gId));
            if (!gDoc.exists()) { await setDoc(doc(doc(db, "groups", gId)), { id: gId, name: gName, creator: currentUserData.username }); }
            if (!currentUserData.groups || !currentUserData.groups.includes(gId)) {
                const myGroups = currentUserData.groups || []; myGroups.push(gId); await updateDoc(doc(db, "users", auth.currentUser.uid), { groups: myGroups });
                currentUserData.groups = myGroups;
            }
            hubInput.value = ''; loadHubs();
        });

        async function loadHubs() {
            hubSelector.innerHTML = '';
            if (currentUserData.friends) { for (let fUid of currentUserData.friends) { const fDoc = await getDoc(doc(db, "users", fUid)); if (fDoc.exists()) createHubTab(fDoc.data(), 'dm'); } }
            if (currentUserData.groups) { for (let gId of currentUserData.groups) { const gDoc = await getDoc(doc(db, "groups", gId)); if (gDoc.exists()) createHubTab(gDoc.data(), 'group'); } }
        }

        function createHubTab(data, type) {
            const tab = document.createElement('div'); tab.classList.add('hub-item'); tab.textContent = type === 'dm' ? `@${data.username.toUpperCase()}` : `👥 ${data.name.toUpperCase()}`;
            tab.addEventListener('click', () => { document.querySelectorAll('.hub-item').forEach(el => el.classList.remove('active')); tab.classList.add('active'); openHub(data, type); });
            hubSelector.appendChild(tab);
        }

        function openHub(data, type) {
            activeHub = { data, type }; chatHeaderTitle.textContent = type === 'dm' ? `ЧАТ: @${data.username.toUpperCase()}` : `ГРУППА: ${data.name.toUpperCase()}`;
            messageInput.disabled = false; sendBtn.disabled = false; voiceStartBtn.disabled = false;
            callBtnsBlock.style.display = type === 'dm' ? 'flex' : 'none';
            
            if (unsubscribeStatus) unsubscribeStatus();
            if (type === 'dm') {
                unsubscribeStatus = onSnapshot(doc(db, "users", data.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        currentFriendStatus = docSnap.data().status || "не в сети";
                        chatHeaderStatus.textContent = `(${currentFriendStatus.toUpperCase()})`;
                    }
                });
            } else {
                chatHeaderStatus.textContent = `(ADMIN: @${data.creator.toUpperCase()})`;
            }
            
            const targetCollectionPath = type === 'dm' ? `chats/${[auth.currentUser.uid, data.uid].sort().join('_')}/messages` : `groups/${data.id}/messages`;
            if (unsubscribeMessages) unsubscribeMessages();

            const mq = query(collection(db, targetCollectionPath), orderBy("timestamp", "asc"));
            unsubscribeMessages = onSnapshot(mq, (snapshot) => {
                messagesArea.innerHTML = '';
                snapshot.forEach((messageDoc) => {
                    const m = messageDoc.data();
                    const isMe = m.senderId === auth.currentUser.uid;
                    
                    const row = document.createElement('div'); row.classList.add('message-row'); if (isMe) row.classList.add('outgoing');
                    const time = m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';

                    let msgContent = `<div>${m.text}</div>`;
                    if (m.isVoice) {
                        msgContent = `<div style="font-weight:bold;">${m.text}</div>`;
                    }

                    row.innerHTML = `
                        <div class="message">
                            <span class="sender-tag">${m.senderName.toUpperCase()}</span>
                            ${msgContent}
                            <div class="meta-container">
                                <span class="message-meta">${time}</span>
                            </div>
                        </div>
                    `;
                    messagesArea.appendChild(row);
                });
                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }

        async function sendMessage() {
            const text = messageInput.value.trim(); if (!text || !activeHub) return;
            const targetPath = activeHub.type === 'dm' ? `chats/${[auth.currentUser.uid, activeHub.data.uid].sort().join('_')}/messages` : `groups/${activeHub.data.id}/messages`;
            
            await addDoc(collection(db, targetPath), { 
                text: text, 
                senderId: auth.currentUser.uid, 
                senderName: currentUserData.displayName || "@" + currentUserData.username, 
                timestamp: new Date()
            });
            messageInput.value = ''; messageInput.focus();
        }
        sendBtn.addEventListener('click', sendMessage); messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
