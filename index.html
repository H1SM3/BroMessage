<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroChat - Liquid Glass Realtime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f0f1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Анимированные сферы под стеклом */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            animation: float 12s infinite alternate ease-in-out;
        }
        body::before {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #7289da, #ff007f);
            top: -10%;
            left: 10%;
        }
        body::after {
            width: 500px;
            height: 500px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            bottom: -10%;
            right: 10%;
            animation-duration: 16s;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 50px) scale(1.2); }
        }

        /* Стиль Жидкого Стекла */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 10;
        }

        /* Окно авторизации */
        .auth-container {
            width: 400px;
            padding: 40px 30px;
            text-align: center;
        }
        .auth-container h2 {
            color: #fff;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(114, 137, 218, 0.5);
        }
        .auth-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            padding: 14px 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .auth-input:focus {
            border-color: #7289da;
            box-shadow: 0 0 15px rgba(114, 137, 218, 0.3);
        }
        .auth-btn {
            width: 100%;
            background: linear-gradient(135deg, #7289da, #5b73c7);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(114, 137, 218, 0.4);
            transition: 0.3s;
            margin-bottom: 15px;
        }
        .auth-btn:hover { transform: translateY(-2px); }
        .toggle-auth { font-size: 13px; color: #00f2fe; cursor: pointer; }

        /* Контейнер мессенджера */
        .messenger-container {
            display: none;
            width: 1000px;
            height: 650px;
            overflow: hidden;
        }
        .sidebar {
            width: 35%;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.1);
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .user-profile {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .my-nickname {
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
        .logout-btn {
            font-size: 11px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 6px;
            color: #ff4f4f;
            cursor: pointer;
        }
        
        /* Кнопка добавления друга */
        .add-friend-box {
            display: flex;
            gap: 8px;
        }
        .friend-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
        }
        .add-friend-btn {
            background: #43b581;
            border: none;
            color: white;
            padding: 0 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-item:hover { background: rgba(255, 255, 255, 0.05); }
        .chat-item.active { background: rgba(114, 137, 218, 0.15); border-left: 3px solid #7289da; }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            margin-right: 12px;
        }

        .chat-window { width: 65%; display: flex; flex-direction: column; }
        .chat-header {
            padding: 22px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.01);
        }
        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.incoming {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.outgoing {
            background: linear-gradient(135deg, rgba(114, 137, 218, 0.3), rgba(91, 115, 199, 0.4));
            border: 1px solid rgba(114, 137, 218, 0.3);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .input-area { padding: 20px; display: flex; gap: 12px; background: rgba(0, 0, 0, 0.1); }
        .message-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            padding: 14px 18px;
            border-radius: 14px;
            color: #fff;
        }
        .send-btn {
            background: linear-gradient(135deg, #7289da, #5b73c7);
            border: none;
            color: white;
            padding: 0 24px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Окно авторизации -->
    <div class="auth-container glass-panel" id="authBox">
        <h2 id="authTitle">Войти в BroChat</h2>
        <input type="text" class="auth-input" id="authUsername" placeholder="Придумай Никнейм" style="display: none;">
        <input type="email" class="auth-input" id="authEmail" placeholder="Твой Email">
        <input type="password" class="auth-input" id="authPassword" placeholder="Пароль">
        <button class="auth-btn" id="authBtn">Войти</button>
        <div class="toggle-auth" id="toggleAuth">Нет аккаунта? Зарегистрироваться</div>
    </div>

    <!-- Главный мессенджер -->
    <div class="messenger-container glass-panel" id="messengerBox">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <span class="my-nickname" id="myNickname">Загрузка...</span>
                    <button class="logout-btn" id="logoutBtn">Выйти</button>
                </div>
                <div class="add-friend-box">
                    <input type="text" class="friend-input" id="friendSearchInput" placeholder="Введите никнейм друга">
                    <button class="add-friend-btn" id="addFriendBtn">+</button>
                </div>
            </div>
            <div class="chat-list" id="chatList"></div>
        </div>

        <div class="chat-window">
            <div class="chat-header" id="chatHeaderTitle">Выберите чат из списка слева</div>
            <div class="messages-area" id="messagesArea"></div>

            <div class="input-area">
                <input type="text" class="message-input" id="messageInput" placeholder="Напиши что-нибудь..." disabled>
                <button class="send-btn" id="sendBtn" disabled>Отправить</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ТВОЙ НОВЫЙ СВЕЖИЙ КОНФИГ С СЕРВЕРА С ИСПРАВЛЕННЫМ КЛЮЧОМ!
        const firebaseConfig = {
            apiKey: "AIzaSyD_eF_UR7iGXbXlHDroAGYPDfAbd6zX27g",
            authDomain: "brochat-ce389.firebaseapp.com",
            projectId: "brochat-ce389",
            storageBucket: "brochat-ce389.appspot.com",
            messagingSenderId: "856173025113",
            appId: "1:856173025113:web:c3910728e5195a62db5e48"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authBox = document.getElementById('authBox');
        const messengerBox = document.getElementById('messengerBox');
        const authTitle = document.getElementById('authTitle');
        const authBtn = document.getElementById('authBtn');
        const toggleAuth = document.getElementById('toggleAuth');
        const usernameInput = document.getElementById('authUsername');
        const emailInput = document.getElementById('authEmail');
        const passwordInput = document.getElementById('authPassword');
        const myNicknameDisplay = document.getElementById('myNickname');
        const logoutBtn = document.getElementById('logoutBtn');
        const friendSearchInput = document.getElementById('friendSearchInput');
        const addFriendBtn = document.getElementById('addFriendBtn');
        const chatList = document.getElementById('chatList');
        const chatHeaderTitle = document.getElementById('chatHeaderTitle');
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        let isSignUp = false;
        let currentUserData = null; 
        let activeChatFriend = null; 
        let unsubscribeMessages = null; 

        toggleAuth.addEventListener('click', () => {
            isSignUp = !isSignUp;
            if (isSignUp) {
                authTitle.textContent = "Регистрация в BroChat";
                authBtn.textContent = "Создать аккаунт";
                toggleAuth.textContent = "Уже есть аккаунт? Войти";
                usernameInput.style.display = 'block'; 
            } else {
                authTitle.textContent = "Войти в BroChat";
                authBtn.textContent = "Войти";
                toggleAuth.textContent = "Нет аккаунта? Зарегистрироваться";
                usernameInput.style.display = 'none';
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    currentUserData = userDoc.data();
                    myNicknameDisplay.textContent = "@" + currentUserData.username;
                    loadFriendsList(); 
                }
                authBox.style.display = 'none';
                messengerBox.style.display = 'flex';
            } else {
                authBox.style.display = 'block';
                messengerBox.style.display = 'none';
                chatList.innerHTML = '';
            }
        });

        authBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const username = usernameInput.value.trim().toLowerCase();

            if (!email || !password || (isSignUp && !username)) {
                alert("Бро, заполни все поля!");
                return;
            }

            try {
                if (isSignUp) {
                    const q = query(collection(db, "users"), where("username", "==", username));
                    const querySnapshot = await getDocs(q);
                    if (!querySnapshot.empty) {
                        alert("Этот никнейм уже занят другим Гусем! Придумай другой.");
                        return;
                    }

                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    await setDoc(doc(db, "users", user.uid), {
                        uid: user.uid,
                        username: username,
                        email: email,
                        friends: [] 
                    });

                    alert("Аккаунт успешно создан, Бро!");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                alert("Косяк: " + error.message);
            }
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        addFriendBtn.addEventListener('click', async () => {
            const targetUsername = friendSearchInput.value.trim().toLowerCase();
            if (!targetUsername) return;
            if (targetUsername === currentUserData.username) {
                alert("Бро, ты не можешь добавить самого себя в друзья! 😂");
                return;
            }

            const q = query(collection(db, "users"), where("username", "==", targetUsername));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                alert("Пользователь с таким никнеймом не найден!");
                return;
            }

            const friendDoc = querySnapshot.docs[0];
            const friendData = friendDoc.data();

            if (currentUserData.friends.includes(friendData.uid)) {
                alert("Этот бро уже есть в твоем списке друзей!");
                return;
            }

            const myNewFriends = [...currentUserData.friends, friendData.uid];
            await setDoc(doc(doc(db, "users", auth.currentUser.uid)), { friends: myNewFriends }, { merge: true });
            currentUserData.friends = myNewFriends;

            const friendNewFriends = [...(friendData.friends || []), auth.currentUser.uid];
            await setDoc(doc(db, "users", friendData.uid), { friends: friendNewFriends }, { merge: true });

            friendSearchInput.value = '';
            alert(`Бро @${friendData.username} успешно добавлен в друзья!`);
            loadFriendsList();
        });

        async function loadFriendsList() {
            chatList.innerHTML = '';
            if (!currentUserData.friends || currentUserData.friends.length === 0) return;

            for (let friendUid of currentUserData.friends) {
                const friendDoc = await getDoc(doc(db, "users", friendUid));
                if (friendDoc.exists()) {
                    const friendData = friendDoc.data();

                    const item = document.createElement('div');
                    item.classList.add('chat-item');
                    item.innerHTML = `
                        <div class="avatar"></div>
                        <div class="chat-info"><strong>@${friendData.username}</strong></div>
                    `;

                    item.addEventListener('click', () => {
                        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                        openChatWith(friendData);
                    });

                    chatList.appendChild(item);
                }
            }
        }

        function openChatWith(friendData) {
            activeChatFriend = friendData;
            chatHeaderTitle.textContent = `Чат с @${friendData.username}`;
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messagesArea.innerHTML = '';

            const chatId = [auth.currentUser.uid, friendData.uid].sort().join('_');

            if (unsubscribeMessages) unsubscribeMessages();

            const messagesQuery = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            
            unsubscribeMessages = onSnapshot(messagesQuery, (snapshot) => {
                messagesArea.innerHTML = '';
                snapshot.forEach((doc) => {
                    const msgData = doc.data();
                    const type = msgData.senderId === auth.currentUser.uid ? 'outgoing' : 'incoming';
                    
                    const time = msgData.timestamp ? new Date(msgData.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--';
                    
                    const messageDiv = document.createElement('div');
                    messageDiv.classList.add('message', type);
                    messageDiv.innerHTML = `
                        <div class="message-text">${msgData.text}</div>
                        <div style="font-size: 10px; color: rgba(255,255,255,0.4); text-align: right; margin-top: 5px;">${time}</div>
                    `;
                    messagesArea.appendChild(messageDiv);
                });
                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '' || !activeChatFriend) return;

            const chatId = [auth.currentUser.uid, activeChatFriend.uid].sort().join('_');

            await addDoc(collection(db, "chats", chatId, "messages"), {
                text: text,
                senderId: auth.currentUser.uid,
                timestamp: new Date()
            });

            messageInput.value = '';
            messageInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
